project:
  type: website
  output-dir: _site

website:
  title: "Portal de Fichas Departamentales | UNGRD"
  site-url: https://fichas-riesgo.ungrd.gov.co   # Actualizar con URL definitiva en producción
  favicon: images/favicon.png
  open-graph:
    title: "Portal de Fichas Departamentales de Riesgo · UNGRD"
    description: >
      Fichas de caracterización de escenarios de riesgo para los 32 departamentos
      de Colombia. Herramienta técnica de la UNGRD para la planificación territorial.

  navbar:
    logo: images/logo-ungrd.png
    logo-alt: "Logo UNGRD"
    background: "#232A60"
    foreground: white
    right:
      - icon: house-fill
        href: index.qmd
        aria-label: Inicio
      - text: "Departamentos"
        href: "#departamentos"

  page-footer:
    background: "#1A2050"
    foreground: white
    left: "© 2026 UNGRD — Unidad Nacional para la Gestión del Riesgo de Desastres"
    center: "Subdirección de Conocimiento del Riesgo"

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: false
    anchor-sections: false
    smooth-scroll: true
    page-layout: full
