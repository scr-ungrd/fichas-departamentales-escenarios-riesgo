project:
  type: website
  output-dir: _site

website:
  title: "Fichas Departamentales | SCR-UNGRD"
  site-url: https://scr-ungrd.github.io/fichas-departamentales-escenarios-riesgo
  favicon: images/favicon.png
  open-graph:
    title: "Fichas Departamentales de Riesgo · UNGRD"
    description: >
      Fichas de caracterización de escenarios de riesgo para los 32 departamentos
      de Colombia. Herramienta técnica de la UNGRD para la planificación territorial.

  navbar:
    logo: images/logo-ungrd.png
    logo-alt: "Logo UNGRD"
    background: light
    foreground: dark
    pinned: true
    right:
      - icon: house-fill
        href: "https://scr-ungrd.github.io/catalogo-publicaciones"
        aria-label: "Catálogo Editorial SCR — inicio"
        target: _blank
        rel: noopener noreferrer
      - icon: diagram-3-fill
        href: "https://scr-ungrd.github.io/hub/"
        aria-label: "HUB SCR — portal de proyectos"
        target: _blank
        rel: noopener noreferrer
      - text: "Departamentos"
        href: "#departamentos"
      - text: "Acerca de"
        href: acerca-de.qmd
      - icon: github
        href: https://github.com/scr-ungrd/fichas-departamentales-escenarios-riesgo
        aria-label: "Repositorio en GitHub"
        target: _blank
        rel: noopener noreferrer
      - icon: translate
        href: "https://translate.google.com/translate?sl=es&tl=en&u=https://scr-ungrd.github.io/fichas-departamentales-escenarios-riesgo/"
        aria-label: "Translate to English"
        target: _blank
        rel: noopener noreferrer


format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: false
    anchor-sections: false
    smooth-scroll: true
    page-layout: full
    include-after-body: _footer.html
